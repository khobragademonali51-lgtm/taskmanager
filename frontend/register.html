<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account - TaskMaster</title>
  <meta name="description" content="Register a new TaskMaster account" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div style="display:flex; justify-content:flex-end; margin-bottom:-20px;">
      <button class="btn-icon-only theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme" aria-label="Toggle theme">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>

    <div class="auth-brand">
      <div class="brand-icon">✓</div>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Get started with your free TaskMaster workspace</p>
    </div>

    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group" style="margin-bottom: 16px;">
        <label for="regName" class="form-label">Full Name <span class="req">*</span></label>
        <input 
          type="text" 
          id="regName" 
          name="name" 
          class="form-control" 
          placeholder="e.g. Alex Johnson" 
          required 
          autocomplete="name"
        />
      </div>

      <div class="form-group" style="margin-bottom: 16px;">
        <label for="regEmail" class="form-label">Email Address <span class="req">*</span></label>
        <input 
          type="email" 
          id="regEmail" 
          name="email" 
          class="form-control" 
          placeholder="e.g. alex@example.com" 
          required 
          autocomplete="email"
        />
      </div>

      <div class="form-group" style="margin-bottom: 16px;">
        <label for="regPassword" class="form-label">Password (Min. 6 chars) <span class="req">*</span></label>
        <input 
          type="password" 
          id="regPassword" 
          name="password" 
          class="form-control" 
          placeholder="••••••••" 
          required 
          minlength="6"
          autocomplete="new-password"
        />
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label for="regConfirmPassword" class="form-label">Confirm Password <span class="req">*</span></label>
        <input 
          type="password" 
          id="regConfirmPassword" 
          name="confirmPassword" 
          class="form-control" 
          placeholder="••••••••" 
          required 
          minlength="6"
          autocomplete="new-password"
        />
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">
        Create Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login.html" style="font-weight: 700;">Sign in here</a>
      <div style="margin-top: 10px;">
        <a href="/" style="font-size: 0.8rem; color: var(--text-muted);">← Back to Homepage</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      checkAuth(true);
    });
  </script>
</body>
</html>
